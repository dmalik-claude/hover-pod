/* ---------- tokens ---------- */
@property --panel     { syntax: '<color>'; inherits: true; initial-value: #fbf8f1; }

:root {
  --bg: #f6f1e7;
  --panel: #fbf8f1;
  --line: #e7e0d1;
  --ink: #1b1a17;
  --muted: #6d685d;
  --sage: #4d5a3d;
  --sage-ink: #ffffff;
  --sage-tint: #e9ebdc;
  --chip: #efeadd;
  --shadow: 60, 48, 28;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
.hero[data-light="dusk"] {
  --bg: #14170f;
  --panel: #1b1f15;
  --line: #2d3324;
  --ink: #f2ecdf;
  --muted: #a8a392;
  --sage: #a9b98a;
  --sage-ink: #14170f;
  --sage-tint: #283020;
  --chip: #262b1d;
  --shadow: 0, 0, 0;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  transition: background-color .6s var(--ease);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
img { display: block; }
p, h1, h2, h3, ul, dl, dd { margin: 0; }
ul { padding: 0; list-style: none; }
:focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.eyebrow { font-size: 9.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; line-height: 1.3; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- hero shell ---------- */
.hero {
  position: relative;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  grid-template-columns: 196px minmax(0, 1fr) clamp(300px, 27vw, 356px);
  grid-template-rows: minmax(0, 1fr);
  background: var(--bg);
  color: var(--ink);
  transition:
    background-color .6s var(--ease), color .6s var(--ease),
    --panel .6s var(--ease), --line .6s var(--ease), --muted .6s var(--ease),
    --sage .6s var(--ease), --sage-ink .6s var(--ease), --sage-tint .6s var(--ease), --chip .6s var(--ease);
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; display: block; }

/* ---------- left sidebar ---------- */
.side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
  padding: 22px 12px 18px 24px;
  border-right: 1px solid var(--line);
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}
.brand { font-family: var(--serif); font-size: 26px; letter-spacing: -.01em; line-height: 1.1; font-weight: 400; }
.nav { display: grid; gap: 2px; margin: 20px 0 12px; flex-shrink: 1; min-height: 0; }
.nav button {
  display: flex; align-items: center; gap: 16px; width: 100%;
  padding: 7px 10px; border-radius: 10px;
  font-size: 14.5px; line-height: 1.2; text-align: left;
  transition: background-color .25s var(--ease);
}
.nav button:hover { background: var(--chip); }
.nav button[aria-current="page"] { background: var(--sage-tint); }
.nav small { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }

.feat { margin-top: auto; flex: none; background: var(--sage-tint); border-radius: 10px; padding: 14px 14px 16px; }
.feat img { width: 92px; height: 76px; object-fit: contain; margin: 8px auto 6px; }
.feat h3 { font-family: var(--serif); font-size: 18px; font-weight: 400; line-height: 1.2; letter-spacing: -.005em; }
.feat p:not(.eyebrow) { font-size: 12px; line-height: 1.4; color: var(--muted); margin-top: 5px; }
.feat :is(img, h3, p:not(.eyebrow)) { transition: opacity .3s var(--ease); }
.feat .more {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
  font-size: 12px; font-weight: 600; color: inherit;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;
}
.feat .more .ic { width: 14px; height: 14px; transition: transform .3s var(--ease); }
.feat .more:hover .ic { transform: translateX(3px); }

/* ---------- centre column ---------- */
.main { display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 48px 18px 14px 26px; min-width: 0; min-height: 0; }
.tabs { display: flex; gap: 10px; transition: opacity .5s var(--ease), transform .5s var(--ease); }
.tab {
  width: 130px;
  padding: 8px 8px 11px;
  display: grid; justify-items: center; align-content: start;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
  transition: transform .3s var(--ease), background-color .3s var(--ease), border-color .3s var(--ease);
}
.tab:hover { transform: translateY(-2px); }
.tab img { width: 58px; height: 52px; object-fit: contain; }
.tab .nm { font-family: var(--serif); font-size: 15.5px; line-height: 1.25; margin-top: 4px; }
.tab .lt { font-family: var(--serif); font-style: italic; font-size: 12.5px; line-height: 1.25; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--sage-tint); border-color: color-mix(in srgb, var(--sage) 45%, transparent); }

.stage {
  position: relative;
  min-height: 0;
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  border-radius: 12px;
}
.stage.dragging { cursor: grabbing; }

.ground {
  position: absolute; left: 50%; bottom: 15%;
  width: min(62%, 460px); height: 44px;
  transform: translateX(-50%);
  background: radial-gradient(closest-side, rgba(var(--shadow), .22), transparent);
  pointer-events: none;
  transition: opacity .45s var(--ease), transform .6s var(--ease);
}
.stage.switching .ground { opacity: 0; transform: translateX(-50%) scaleX(.4); }

.loader {
  position: absolute; left: 50%; top: 44%;
  transform: translate(-50%, -50%);
  display: grid; justify-items: center; gap: 12px;
  font-size: 12.5px; color: var(--muted); white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity .4s var(--ease);
}
.loader.show { opacity: 1; }
.loader i { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); border-top-color: var(--sage); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.fallback {
  position: absolute; left: 50%; top: 44%;
  transform: translate(-50%, -50%);
  width: min(72%, 520px); height: 66%;
  object-fit: contain;
  display: none; pointer-events: none;
}
.fallback.show { display: block; animation: fadein .6s var(--ease) both; }
@keyframes fadein { from { opacity: 0; } }

.hint {
  position: absolute; top: 6px; right: 0;
  display: flex; align-items: center; gap: 8px;
  font-size: 11.5px; color: var(--muted);
  pointer-events: none;
  transition: opacity .6s var(--ease);
}
.hint .ic { width: 16px; height: 16px; }
.hint.gone { opacity: 0; }

.rail { position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 6; display: grid; gap: 9px; }
.rbtn {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--panel); border: 1px solid var(--line);
  transition: transform .2s var(--ease), border-color .2s var(--ease), background-color .25s var(--ease), color .25s var(--ease);
}
.rbtn .ic { width: 17px; height: 17px; }
.rbtn:hover { border-color: var(--sage); }
.rbtn:active { transform: scale(.92); }
.rbtn[aria-pressed="true"] { background: var(--sage); border-color: var(--sage); color: var(--sage-ink); }

.turn {
  position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%); z-index: 6;
  display: flex; align-items: center; gap: 2px;
  padding: 3px 6px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line);
  font-size: 13px;
}
.turn button {
  height: 30px; min-width: 30px; border-radius: 999px;
  display: grid; place-items: center;
  transition: background-color .2s var(--ease), transform .2s var(--ease);
}
.turn button:hover { background: var(--chip); }
.turn button:active { transform: scale(.92); }
.turn .ic { width: 17px; height: 17px; }
.turn .deg { padding: 0 9px; font-weight: 600; letter-spacing: .01em; font-variant-numeric: tabular-nums; }

.caption {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: max-content; max-width: 100%;
  font-family: var(--serif); font-style: italic; font-size: clamp(16px, 1.55vw, 20px);
  line-height: 1.3; text-align: center; text-wrap: balance;
  transition: opacity .35s var(--ease);
}

/* ---------- right column ---------- */
.info {
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px;
  padding: 13px 26px 14px 0;
  min-width: 0; min-height: 0;
  transition: opacity .5s var(--ease), transform .5s var(--ease);
}
.tools { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-m { display: none; font-family: var(--serif); font-size: 21px; letter-spacing: -.01em; line-height: 1.1; margin-right: auto; white-space: nowrap; }
.search {
  flex: 1; min-width: 0; height: 32px;
  display: flex; align-items: center; gap: 8px; padding: 0 10px 0 9px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  transition: border-color .2s var(--ease);
}
.search:focus-within { border-color: color-mix(in srgb, var(--sage) 60%, transparent); }
.search .s-btn { display: grid; place-items: center; color: var(--muted); flex: none; }
.search .s-btn .ic { width: 15px; height: 15px; }
.search input {
  flex: 1; min-width: 0; height: 100%;
  border: 0; background: transparent; color: inherit;
  font: inherit; font-size: 11.5px;
  text-overflow: ellipsis;
  -webkit-appearance: none; appearance: none;
}
.search input:focus { outline: none; }
.search input::placeholder { color: var(--muted); opacity: 1; }
.ibtn { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 8px; transition: background-color .2s var(--ease); }
.ibtn:hover { background: var(--chip); }
.ibtn .ic { width: 19px; height: 19px; }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); transition: background-color .6s var(--ease), color .6s var(--ease); }
.avatar .ic { width: 15px; height: 15px; }

.card {
  display: flex; flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 22px 20px 16px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
}
.card::-webkit-scrollbar { width: 6px; }
.card::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.article { display: flex; flex-direction: column; flex: 1 0 auto; }
.article h1 {
  font-family: var(--serif); font-weight: 500;
  font-size: clamp(40px, 4.2vw, 54px); line-height: 1; letter-spacing: -.025em;
  margin-top: 8px;
}
.article h1:focus { outline: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.tags li { font-size: 11.5px; line-height: 1.2; padding: 6px 13px; border-radius: 999px; background: var(--chip); }
.desc { font-size: 13.5px; line-height: 1.55; text-wrap: pretty; margin: 16px 0 20px; }
.article h2 {
  font-family: var(--serif); font-weight: 400; font-size: 21px; line-height: 1.2; letter-spacing: -.005em;
  border-top: 1px solid var(--line); padding-top: 14px; margin-bottom: 8px;
}
.traits { display: grid; margin-bottom: 18px; }
.trait { display: grid; grid-template-columns: 22px 88px 1fr; gap: 16px; align-items: center; font-size: 13px; line-height: 1.35; padding: 6px 0; }
.trait .ic, .habitat .ic { color: var(--sage); justify-self: center; }
.trait dt { color: var(--muted); }
.habitat { display: grid; grid-template-columns: 22px 1fr; gap: 16px; align-items: center; font-size: 13px; line-height: 1.4; padding: 6px 0; margin-bottom: 20px; }

.closeup {
  margin-top: auto;
  display: grid; grid-template-columns: 76px 1fr 18px; gap: 14px; align-items: center;
  padding: 10px; width: 100%;
  border: 1px solid var(--line); border-radius: 8px;
  text-align: left;
  transition: border-color .25s var(--ease), background-color .25s var(--ease);
}
.closeup:hover, .closeup[aria-pressed="true"] { border-color: var(--sage); background: var(--sage-tint); }
.lens {
  width: 76px; height: 76px; border-radius: 50%;
  background-color: var(--chip); background-repeat: no-repeat; background-size: 520%;
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 8%, transparent);
}
.cu-title { display: block; font-family: var(--serif); font-size: 18px; line-height: 1.2; }
.cu-desc { display: block; font-size: 11.5px; line-height: 1.4; color: var(--muted); margin-top: 3px; text-wrap: pretty; }
.closeup .ic { width: 18px; height: 18px; transition: transform .45s var(--ease); }
.closeup[aria-pressed="true"] .ic { transform: rotate(180deg); }

/* detail swap */
.article.out > * { opacity: 0; transform: translateY(-6px); transition: opacity .2s ease-in, transform .2s ease-in; }
.article.in > * { animation: rise .6s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.hero.swapping .caption, .hero.swapping .feat :is(img, h3, p:not(.eyebrow)) { opacity: 0; transition-duration: .2s; }

/* ---------- focus (expanded) mode ---------- */
.hero.focus .side { opacity: 0; transform: translateX(-24px); pointer-events: none; }
.hero.focus .info { opacity: 0; transform: translateX(24px); pointer-events: none; }
.hero.focus .tabs { opacity: 0; transform: translateY(-16px); pointer-events: none; }

/* ---------- short desktop viewports ---------- */
@media (max-height: 760px) and (min-width: 761px) {
  .nav { margin: 16px 0 10px; }
  .nav button { padding-top: 5px; padding-bottom: 5px; }
  .feat img { height: 52px; margin: 6px auto 4px; }
  .feat p:not(.eyebrow) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
}
@media (max-height: 680px) and (min-width: 761px) {
  .feat img { display: none; }
  .feat h3 { margin-top: 6px; }
}
@media (max-height: 620px) and (min-width: 761px) {
  .main { padding-top: 22px; }
  .side { padding-top: 16px; }
  .feat img, .feat p:not(.eyebrow) { display: none; }
  .feat h3 { margin-top: 6px; }
}

/* ---------- tablet ---------- */
@media (max-width: 1100px) {
  .hero { grid-template-columns: minmax(0, 1fr) clamp(280px, 36vw, 340px); }
  .side { display: none; }
  .main { padding-left: 20px; }
}

/* ---------- phone ---------- */
@media (max-width: 760px) {
  .hero { display: flex; flex-direction: column; }
  .info { display: contents; }

  .tools { order: 1; flex: none; padding: 10px 14px 0; transition: opacity .5s var(--ease); }
  .brand-m { display: block; }
  .search { flex: none; width: 32px; padding: 0; justify-content: center; border-radius: 50%; }
  .search input { display: none; }
  .tools.searching .brand-m { display: none; }
  .tools.searching .search { flex: 1; width: auto; padding: 0 10px 0 9px; justify-content: flex-start; border-radius: 8px; }
  .tools.searching .search input { display: block; font-size: 16px; }

  .main { order: 2; flex: 1; min-height: 0; padding: 10px 14px 6px; gap: 8px; }
  .tabs { gap: 8px; }
  .tab {
    flex: 1 1 0; width: auto; min-width: 0;
    grid-template-columns: 44px minmax(0, 1fr); column-gap: 10px;
    justify-items: start; align-items: center;
    padding: 6px 10px; text-align: left;
  }
  .tab img { grid-row: span 2; width: 44px; height: 40px; }
  .tab .nm { font-size: 15px; margin: 0; align-self: end; }
  .tab .lt { font-size: 12px; align-self: start; }
  .tab .nm, .tab .lt { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .rail { gap: 7px; }
  .rbtn { width: 34px; height: 34px; }
  .turn { bottom: 30px; }
  .caption { font-size: 15px; }
  .hint { display: none; }
  .ground { bottom: 17%; height: 30px; }

  .card {
    order: 3; flex: none; position: relative; z-index: 7;
    max-height: 40dvh;
    border-width: 1px 0 0;
    border-radius: 16px 16px 0 0;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -10px 30px rgba(var(--shadow), .07);
    transition: transform .5s var(--ease), margin-bottom .5s var(--ease);
  }
  .article h1 { font-size: 34px; }
  .article h2 { font-size: 19px; }

  .hero.focus .info { opacity: 1; transform: none; }
  /* sheet slides away and hands its height back to the stage, so pill + caption settle at the bottom */
  .hero.focus .card { transform: translateY(24px); margin-bottom: -40dvh; pointer-events: none; }
  .hero.focus .tools { opacity: 0; pointer-events: none; }
  .ground { transition: opacity .45s var(--ease), transform .6s var(--ease), bottom .5s var(--ease); }
  .hero.focus .ground { bottom: 36%; }
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-delay: 0ms !important;
    transition-duration: .01ms !important;
    transition-delay: 0ms !important;
  }
  .loader i { animation-duration: 1.6s !important; animation-iteration-count: infinite; }
}
</style>

<script type="module">
/* ============================================================
   Data

const CDN = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/';
const BIRDS = [
  {

    traits: [
      ['ruler', 'Length', '16–17 cm'],
      ['gauge', 'Dive speed', 'Up to 40 km/h'],
      ['fish', 'Diet', 'Small fish and insects'],
      ['globe', 'Range', 'Europe and Asia'],
    ],
    habitat: 'Slow rivers, streams and lakes.',
    caption: 'Blink, and the river keeps its secret.',
    closeup: 'An intricate mosaic of structure and colour gives the kingfisher its unmistakable sheen.',
    lens: '24% 30%',
    featTitle: 'A flash of river blue.',
    featText: 'Extraordinary colours. A remarkable life by the water.',
    img: CDN + 'hf_20261004_073256_f9e3e60d-acdc-4925-b393-c4ce14b28711.png',
    glb: CDN + 'hf_20261004_073345_12721630-c589-442f-8884-e4a445cd8980.glb',
  },
];

/* ============================================================
   State + DOM
   ============================================================ */
const DUR = 780, ZMIN = 0.55, ZMAX = 3.4;
const S = {
  active: 1, zoom: 1, zoomT: 1, focus: false, dusk: false,
  turnY: 0, turnX: 0, velX: 0, velY: 0,
  dragging: false, homing: false, lastInteract: performance.now(),
};
const view = { W: 0, H: 0, sx: 0, sy: 0, sw: 0, sh: 0, cx: 0, cy: 0, px: 300, framed: false };
let G = null;            // 3D context once ready
let glFailed = false;

const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const phoneMQ = matchMedia('(max-width: 760px)');
const reduced = () => reduceMQ.matches;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const $ = (s) => document.querySelector(s);

const hero = $('#hero'), stage = $('#stage'), canvas = $('#gl');
const article = $('#article'), detail = $('#detail'), caption = $('#caption');
const loaderEl = $('#loader'), fallbackEl = $('#fallback'), hint = $('#hint');
const featImg = $('#featImg'), featTitle = $('#featTitle'), featText = $('#featText');
const zinBtn = $('#zin'), zoutBtn = $('#zout'), expandBtn = $('#expand'), lightBtn = $('#light');
const side = $('.side'), info = $('.info'), tablist = $('.tabs'), tools = $('.tools');
const searchInput = $('.search input'), searchBtn = $('.search .s-btn'), themeMeta = $('meta[name="theme-color"]');
const tabs = [...document.querySelectorAll('.tab')];

const ic = (id) => `<svg class="ic" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ============================================================
   Detail panel + side info
   ============================================================ */
function renderArticle(b) {
  article.innerHTML = `
    <p class="eyebrow">${b.family}</p>
    <h1 tabindex="-1">${b.name}</h1>
    <ul class="tags">${b.tags.map((t) => `<li>${t}</li>`).join('')}</ul>
    <p class="desc">${b.desc}</p>
    <h2>Key Traits</h2>
    <dl class="traits">${b.traits.map(([i, l, v]) => `<div class="trait">${ic(i)}<dt>${l}</dt><dd>${v}</dd></div>`).join('')}</dl>
    <h2>Habitat</h2>
    <p class="habitat">${ic('reed')}<span>${b.habitat}</span></p>
    <button class="closeup" type="button" aria-pressed="false">
      <span class="lens" aria-hidden="true" style="background-image:url('${b.img}');background-position:${b.lens}"></span>
      <span><span class="cu-title">Close-up Detail</span><span class="cu-desc">${b.closeup}</span></span>
      ${ic('chev')}
    </button>`;
  [...article.children].forEach((el, i) => el.style.setProperty('--i', i));
  detail.scrollTop = 0;
  syncZoomUI();
}

function renderAux(i) {
  const b = BIRDS[i];
  caption.textContent = b.caption;
  featImg.src = b.img;
  featTitle.textContent = b.featTitle;
  featText.textContent = b.featText;
  detail.setAttribute('aria-labelledby', tabs[i].id);
  stage.setAttribute('aria-label', `Interactive 3D ${b.name}. Drag to turn it, scroll or pinch to zoom, double-click to reset. Arrow keys rotate, plus and minus zoom, 0 resets.`);
}

let swapT1 = 0, swapT2 = 0;
function swapInfo(i) {
  clearTimeout(swapT1); clearTimeout(swapT2);
  article.classList.remove('in');
  if (reduced()) {
    article.classList.remove('out'); hero.classList.remove('swapping');
    renderArticle(BIRDS[i]); renderAux(i);
    return;
  }
  article.classList.add('out');
  hero.classList.add('swapping');
  swapT1 = setTimeout(() => {
    renderArticle(BIRDS[i]); renderAux(i);
    article.classList.remove('out');
    hero.classList.remove('swapping');
    void article.offsetWidth;
    article.classList.add('in');
    swapT2 = setTimeout(() => article.classList.remove('in'), 600 + 45 * article.children.length + 80);
  }, 200);
}

/* ============================================================
   UI state helpers
   ============================================================ */
function press(el, on) {
  const v = on ? 'true' : 'false';
  if (el && el.getAttribute('aria-pressed') !== v) el.setAttribute('aria-pressed', v);
}
function syncZoomUI() {
  press(zinBtn, S.zoomT >= 1);
  press(zoutBtn, S.zoomT < 1);
  press(article.querySelector('.closeup'), S.zoomT > 2.2);
}
function setZoom(z) {
  z = clamp(z, ZMIN, ZMAX);
  if (Math.abs(z - 1) < 1e-6) z = 1;
  S.zoomT = z;
  syncZoomUI();
}

let hintGone = false;
function interact() {
  S.lastInteract = performance.now();
  if (!hintGone) { hintGone = true; hint.classList.add('gone'); }
}

function goHome() {
  S.homing = true;
  S.turnY = S.turnX = S.velX = S.velY = 0;
  setZoom(1);
  interact();
}

function setFocus(on) {
  S.focus = on;
  hero.classList.toggle('focus', on);
  press(expandBtn, on);
  expandBtn.setAttribute('aria-label', on ? 'Exit expanded view' : 'Expand view');
  side.inert = on; info.inert = on; tablist.inert = on;
}

function setDusk(on) {
  S.dusk = on;
  hero.dataset.light = on ? 'dusk' : 'day';
  document.body.style.backgroundColor = on ? '#14170f' : '';
  themeMeta.setAttribute('content', on ? '#14170f' : '#f6f1e7');
  press(lightBtn, on);
}

function updateStatus() {
  const r = G && G.rigs[S.active];
  const failed = glFailed || !!(r && r.failed);
  loaderEl.classList.toggle('show', !failed && !(r && r.loaded));
  if (failed) {
    const b = BIRDS[S.active];
    if (fallbackEl.getAttribute('src') !== b.img) fallbackEl.src = b.img;
    fallbackEl.alt = `${b.name} illustration`;
    if (!G || !G.switching()) stage.classList.remove('switching');
  }
  fallbackEl.classList.toggle('show', failed);
}

function select(i) {
  if (i === S.active || i < 0 || i >= BIRDS.length) return;
  const from = S.active;
  S.active = i;
  tabs.forEach((t, j) => {
    t.setAttribute('aria-selected', j === i ? 'true' : 'false');
    t.tabIndex = j === i ? 0 : -1;
  });
  swapInfo(i);
  S.turnY = S.turnX = S.velX = S.velY = 0;
  S.homing = false;
  S.lastInteract = performance.now();
  setZoom(1);
  if (G) G.switchTo(from, i);
  updateStatus();
}

/* ============================================================
   Wiring: tabs, rail, turn pill, close-up, search, keys
   ============================================================ */
tabs.forEach((t, i) => t.addEventListener('click', () => select(i)));
tablist.addEventListener('keydown', (e) => {
  const i = tabs.indexOf(document.activeElement);
  if (i < 0) return;
  let n = null;
  if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
  else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
  else if (e.key === 'Home') n = 0;
  else if (e.key === 'End') n = tabs.length - 1;
  if (n === null) return;
  e.preventDefault();
  select(n);
  tabs[n].focus();
});

zinBtn.addEventListener('click', () => { setZoom(S.zoomT * 1.35); interact(); });
zoutBtn.addEventListener('click', () => { setZoom(S.zoomT / 1.35); interact(); });
expandBtn.addEventListener('click', () => { setFocus(!S.focus); interact(); });
lightBtn.addEventListener('click', () => setDusk(!S.dusk));

const queueTurn = (a) => { S.homing = false; S.turnY += a; interact(); };
$('#turnL').addEventListener('click', () => queueTurn(-Math.PI / 2));
$('#turnR').addEventListener('click', () => queueTurn(Math.PI / 2));
$('#turn360').addEventListener('click', () => queueTurn(Math.PI * 2));

article.addEventListener('click', (e) => {
  if (!e.target.closest('.closeup')) return;
  setZoom(S.zoomT > 2.2 ? 1 : 2.6);
  interact();
});

$('#learnMore').addEventListener('click', (e) => {
  e.preventDefault();
  detail.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
  article.querySelector('h1')?.focus({ preventScroll: true });
});

searchBtn.addEventListener('mousedown', (e) => e.preventDefault());
searchBtn.addEventListener('click', () => {
  if (phoneMQ.matches && tools.classList.contains('searching') && !searchInput.value) {
    tools.classList.remove('searching');
    return;
  }
  if (phoneMQ.matches) tools.classList.add('searching');
  searchInput.focus();
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) return;
    const i = BIRDS.findIndex((b) =>
      [b.name, b.latin, b.family, b.habitat, ...b.tags, ...b.traits.map((t) => t[2])].join(' ').toLowerCase().includes(q));
    if (i >= 0) select(i);
  } else if (e.key === 'Escape') {
    e.stopPropagation();
    searchInput.value = '';
    searchInput.blur();
  }
});
searchInput.addEventListener('blur', () => { if (!searchInput.value) tools.classList.remove('searching'); });

addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.focus) setFocus(false);
});

stage.addEventListener('keydown', (e) => {
  if (e.target !== stage) return;
  const R = 0.18;
  switch (e.key) {
    case 'ArrowLeft':  S.homing = false; S.turnY -= R; break;
    case 'ArrowRight': S.homing = false; S.turnY += R; break;
    case 'ArrowUp':    S.homing = false; S.turnX -= R; break;
    case 'ArrowDown':  S.homing = false; S.turnX += R; break;
    case '+': case '=': setZoom(S.zoomT * 1.2); break;
    case '-': case '_': setZoom(S.zoomT / 1.2); break;
    case '0': goHome(); break;
    default: return;
  }
  e.preventDefault();
  interact();
});

/* ============================================================
   Pointer: free rotation, inertia, pinch, wheel, double-tap
   ============================================================ */
const ptrs = new Map();
let pinchD0 = 1, pinchZ0 = 1, lastMoveT = 0, lastTapT = 0;

// Drag anywhere on the stage; in expanded view, anywhere on the hero.
function grabbable(t) {
  if (t.closest('button, a, input, [role="tab"]')) return false;
  return stage.contains(t) || S.focus;
}
const rotateBy = (ay, ax) => { if (G) G.rotateBy(ay, ax); };

hero.addEventListener('pointerdown', (e) => {
  if (e.button > 0 || !grabbable(e.target)) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: e.timeStamp });
  if (ptrs.size === 1) {
    S.dragging = true;
    S.homing = false;
    S.velX = S.velY = 0;
    S.turnX = 0;
    lastMoveT = e.timeStamp;
    stage.classList.add('dragging');
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinchD0 = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    pinchZ0 = S.zoomT;
    S.velX = S.velY = 0;
  }
  interact();
});

stage.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    const k = Math.PI / Math.max(260, view.px * 1.6);
    rotateBy(dx * k, dy * k);
    const dts = Math.max(8, e.timeStamp - lastMoveT) / 1000;
    lastMoveT = e.timeStamp;
    S.velY = clamp(S.velY * 0.35 + (dx * k / dts) * 0.65, -14, 14);
    S.velX = clamp(S.velX * 0.35 + (dy * k / dts) * 0.65, -14, 14);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    setZoom(pinchZ0 * Math.hypot(a.x - b.x, a.y - b.y) / pinchD0);
  }
  interact();
});

function release(e) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0) {
    S.dragging = false;
    stage.classList.remove('dragging');
    if (e.timeStamp - lastMoveT > 90) S.velX = S.velY = 0;     // held still before letting go
    // double-tap (touch/pen) resets; mice use dblclick
    if (e.pointerType !== 'mouse' && e.type === 'pointerup' &&
        Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < 10 && e.timeStamp - p.t < 300) {
      if (e.timeStamp - lastTapT < 320) { goHome(); lastTapT = 0; } else lastTapT = e.timeStamp;
    }
  } else {
    S.velX = S.velY = 0;
    lastMoveT = e.timeStamp;
  }
  S.lastInteract = performance.now();
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('lostpointercapture', release);

hero.addEventListener('dblclick', (e) => { if (grabbable(e.target)) goHome(); });

hero.addEventListener('wheel', (e) => {
  if (!(stage.contains(e.target) || S.focus)) return;
  e.preventDefault();
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
  setZoom(S.zoomT * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0016)));
  interact();
}, { passive: false });

// Safari trackpad pinch
let gestureZ0 = 1;
hero.addEventListener('gesturestart', (e) => { if (stage.contains(e.target) || S.focus) { e.preventDefault(); gestureZ0 = S.zoomT; } });
hero.addEventListener('gesturechange', (e) => {
  if (!(stage.contains(e.target) || S.focus)) return;
  e.preventDefault();
  if (ptrs.size) return;                      // touch pinch is handled by pointer events
  setZoom(gestureZ0 * e.scale);
  interact();
});

/* ============================================================
   Layout measurement + framing targets
   ============================================================ */
function measure() {
  const hr = hero.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  view.W = hr.width; view.H = hr.height;
  view.sx = sr.left - hr.left; view.sy = sr.top - hr.top;
  view.sw = sr.width; view.sh = sr.height;
  if (G) G.resize();
}
function frameTarget() {
  if (S.focus) return [view.W / 2, view.H * 0.5, Math.min(view.W * 0.5, view.H * 0.6) * 1.16];
  return [view.sx + view.sw / 2, view.sy + view.sh * 0.44, Math.min(view.sw * 0.5, view.sh * 0.6) * 1.16];
}
new ResizeObserver(measure).observe(hero);
new ResizeObserver(measure).observe(stage);
addEventListener('resize', measure);
document.fonts?.ready.then(measure);

/* ============================================================
   Initial paint
   ============================================================ */
renderArticle(BIRDS[S.active]);
renderAux(S.active);
measure();
if (!reduced()) {
  article.classList.add('in');
  swapT2 = setTimeout(() => article.classList.remove('in'), 600 + 45 * article.children.length + 80);
}

/* ============================================================
   3D
   ============================================================ */
async function initGL() {
  let THREE, GLTFLoader, DRACOLoader, MeshoptDecoder, RoomEnvironment;
  try {
    [THREE, { GLTFLoader }, { DRACOLoader }, { MeshoptDecoder }, { RoomEnvironment }] = await Promise.all([
      import('three'),
      import('three/addons/loaders/GLTFLoader.js'),
      import('three/addons/loaders/DRACOLoader.js'),
      import('three/addons/libs/meshopt_decoder.module.js'),
      import('three/addons/environments/RoomEnvironment.js'),
    ]);
  } catch (err) {
    console.warn('Feather Atlas: could not load three.js', err);
    glFailed = true; updateStatus(); return;
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  } catch (err) {
    console.warn('Feather Atlas: WebGL unavailable', err);
    glFailed = true; updateStatus(); return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.95;

  const FOV = 26, TAN = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.01, 100);
  camera.position.set(0, 0, 4);
  camera.lookAt(0, 0, 0);

  const key = new THREE.DirectionalLight(0xfff4e2, 1.6);
  key.position.set(2.5, 4, 5);
  const rim = new THREE.DirectionalLight(0xbfd8ff, 0.5);
  rim.position.set(-4, 2, -3);
  scene.add(key, rim);

  const LIGHTS = {
    day:  { env: 0.95, key: 1.6, keyColor: new THREE.Color(0xfff4e2), rim: 0.5, exposure: 1.05 },
    dusk: { env: 0.28, key: 2.6, keyColor: new THREE.Color(0xffc98a), rim: 1.9, exposure: 1.0 },
  };

  const HOME_Q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.12, 0.75, 0, 'YXZ'));
  const AX_Y = new THREE.Vector3(0, 1, 0), AX_X = new THREE.Vector3(1, 0, 0);
  const qTmp = new THREE.Quaternion();

  // pivot (slide, scale, idle sway) > spin (user rotation) > holder (normalise) > GLB scene
  const rigs = BIRDS.map((b, i) => {
    const pivot = new THREE.Group(), spin = new THREE.Group(), holder = new THREE.Group();
    pivot.add(spin); spin.add(holder); scene.add(pivot);
    pivot.visible = false;
    spin.quaternion.copy(HOME_Q);
    return { i, pivot, spin, holder, loaded: false, failed: false, promise: null, s: 1, x: 0, yaw: 0, vis: false };
  });

  const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
  const loader = new GLTFLoader().setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  function load(i) {
    const r = rigs[i];
    if (r.promise) return r.promise;
    r.promise = loader.loadAsync(BIRDS[i].glb).then(async (gltf) => {
      const model = gltf.scene || gltf.scenes[0];
      model.updateMatrixWorld(true);
      const sphere = new THREE.Box3().setFromObject(model, true).getBoundingSphere(new THREE.Sphere());
      model.position.sub(sphere.center);
      r.holder.scale.setScalar(1 / (sphere.radius || 1));
      model.traverse((o) => {
        o.frustumCulled = false;
        if (!o.isMesh) return;
        for (const m of [].concat(o.material)) {
          if (m && m.map) { m.map.anisotropy = maxAniso; m.map.needsUpdate = true; }
        }
      });
      r.holder.add(model);
      try { await renderer.compileAsync(model, camera, scene); } catch { /* compiled lazily on first draw */ }
      r.loaded = true;
    }).catch((err) => {
      console.warn(`Feather Atlas: could not load ${BIRDS[i].name}`, err);
      r.failed = true;
    }).finally(updateStatus);
    return r.promise;
  }

  function rotateActive(ay, ax) {
    const q = rigs[S.active].spin.quaternion;
    if (ay) q.premultiply(qTmp.setFromAxisAngle(AX_Y, ay));
    if (ax) q.premultiply(qTmp.setFromAxisAngle(AX_X, ax));
  }

  // tab-switch choreography
  let sw = null;
  function switchTo(from, to) {
    load(to);
    rigs[to].spin.quaternion.copy(HOME_Q);
    if (reduced()) { sw = null; stage.classList.remove('switching'); return; }
    sw = { from, to, dir: Math.sign(to - from), start: performance.now(), inStart: null,
           slide: view.sw * 0.95 / Math.max(1, view.px) };
    stage.classList.add('switching');
  }

  let lastW = 0, lastH = 0, lastDpr = 0;
  function resize() {
    const dpr = Math.min(devicePixelRatio, 2);
    if (view.W === lastW && view.H === lastH && dpr === lastDpr) return;
    lastW = view.W; lastH = view.H; lastDpr = dpr;
    renderer.setPixelRatio(dpr);
    renderer.setSize(Math.max(1, view.W), Math.max(1, view.H), false);
  }

  G = { rigs, rotateBy: rotateActive, switchTo, resize, switching: () => !!sw };
  resize();

  // first appearance: pop in, no slide
  if (reduced()) stage.classList.remove('switching');
  else sw = { from: null, to: S.active, dir: 0, start: performance.now(), inStart: null, slide: 0 };

  const first = S.active;
  updateStatus();
  load(first).finally(() => BIRDS.forEach((_, i) => load(i)));

  let last = performance.now(), idle = 0;
  const ease3in = (p) => p * p * p;
  const ease3out = (p) => 1 - (1 - p) ** 3;
  const outBack = (p) => { const q = p - 1; return 1 + 2.2 * q * q * q + 1.2 * q * q; };

  function tick(now) {
    requestAnimationFrame(tick);
    const dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    const t = now / 1000;
    if (!view.W || !view.H) return;

    // framing
    const [tcx, tcy, tpx] = frameTarget();
    if (!view.framed) {
      view.cx = tcx; view.cy = tcy; view.px = tpx; view.framed = true;
    } else {
      const k = 1 - Math.exp(-dt * 7);
      view.cx += (tcx - view.cx) * k;
      view.cy += (tcy - view.cy) * k;
      view.px += (tpx - view.px) * k;
    }
    S.zoom += (S.zoomT - S.zoom) * (1 - Math.exp(-dt * 6));

    // rotation: home slerp, turn queues, inertia
    const spinQ = rigs[S.active].spin.quaternion;
    if (S.homing) {
      spinQ.slerp(HOME_Q, 1 - Math.exp(-dt * 6));
      if (spinQ.angleTo(HOME_Q) < 1e-3) { spinQ.copy(HOME_Q); S.homing = false; }
    }
    const kq = 1 - Math.exp(-dt * 4.2);
    if (S.turnY) {
      let st = S.turnY * kq;
      if (Math.abs(S.turnY - st) < 1e-4) st = S.turnY;
      S.turnY -= st; rotateActive(st, 0);
    }
    if (S.turnX) {
      let st = S.turnX * kq;
      if (Math.abs(S.turnX - st) < 1e-4) st = S.turnX;
      S.turnX -= st; rotateActive(0, st);
    }
    if (!S.dragging && (S.velX || S.velY)) {
      rotateActive(S.velY * dt, S.velX * dt);
      const d = Math.exp(-dt * 4.5);
      S.velX *= d; S.velY *= d;
      if (Math.abs(S.velX) + Math.abs(S.velY) < 1e-3) S.velX = S.velY = 0;
    }

    // idle life
    const still = !reduced();
    const idleOn = still && !S.dragging && !sw && now - S.lastInteract > 1800;
    idle = idleOn ? Math.min(1, idle + dt / 1.5) : Math.max(0, idle - dt / 0.6);
    const ia = idle * idle * (3 - 2 * idle);

    // per-rig rest pose, then switch overrides
    for (const r of rigs) { r.s = 1; r.x = 0; r.yaw = 0; r.vis = r.loaded && r.i === S.active; }
    if (sw) {
      const rIn = rigs[sw.to];
      if (sw.inStart === null && rIn.loaded) sw.inStart = now;
      let outDone = true, inDone = rIn.failed;
      if (sw.from !== null) {
        const p = clamp((now - sw.start) / (DUR * 0.6), 0, 1), e = ease3in(p);
        const r = rigs[sw.from];
        r.s = 1 - e; r.x = -sw.dir * e * sw.slide; r.yaw = -sw.dir * e * 1.4;
        r.vis = r.loaded && p < 1;
        outDone = p >= 1;
      }
      if (sw.inStart !== null) {
        const p = clamp((now - sw.inStart) / DUR, 0, 1), e = ease3out(p);
        rIn.s = outBack(p) * (0.25 + 0.75 * e);
        rIn.x = sw.dir * (1 - e) * sw.slide;
        rIn.yaw = sw.dir * (1 - e) * 1.6;
        inDone = p >= 1;
      } else {
        rIn.vis = false;
      }
      if (outDone && inDone) { sw = null; stage.classList.remove('switching'); }
    }
    for (const r of rigs) {
      r.pivot.visible = r.vis;
      if (!r.vis) continue;
      r.pivot.position.set(r.x, still ? Math.sin(t * 1.3 + r.i) * 0.028 : 0, 0);
      r.pivot.rotation.set(Math.sin(t * 0.9) * 0.03 * ia, r.yaw + Math.sin(t * 0.55) * 0.16 * ia, 0);
      r.pivot.scale.setScalar(Math.max(1e-4, r.s));
    }

    // lighting mood
    const L = S.dusk ? LIGHTS.dusk : LIGHTS.day, kl = 1 - Math.exp(-dt * 4);
    scene.environmentIntensity += (L.env - scene.environmentIntensity) * kl;
    key.intensity += (L.key - key.intensity) * kl;
    key.color.lerp(L.keyColor, kl);
    rim.intensity += (L.rim - rim.intensity) * kl;
    renderer.toneMappingExposure += (L.exposure - renderer.toneMappingExposure) * kl;

    // camera: radius-1 bird spans px*zoom pixels, origin lands on (cx, cy)
    const px = Math.max(20, view.px);
    camera.aspect = view.W / view.H;
    camera.position.z = view.H / (2 * TAN * px * S.zoom);
    camera.setViewOffset(view.W, view.H, view.W / 2 - view.cx, view.H / 2 - view.cy, view.W, view.H);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);
}

initGL();
</script>
</body>
</html>
