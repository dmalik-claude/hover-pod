<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d3d3d2">
<title>Concept Vehicle</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js">
<!-- The 3D model, embedded so the page also works when opened straight from Finder. -->
<script src="car-assets.js" defer></script>
<!-- Optional: licensed Futura fonts, present on the designer's Mac only (not in the public repository). -->
<script src="car-fonts.js" defer onerror="this.remove()"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
/* ---------- tokens ---------- */
@property --ink    { syntax: '<color>'; inherits: true; initial-value: #121212; }
@property --muted  { syntax: '<color>'; inherits: true; initial-value: #6c6c6c; }
@property --accent { syntax: '<color>'; inherits: true; initial-value: #e3262d; }
@property --paper  { syntax: '<color>'; inherits: true; initial-value: #e7e7e6; }

:root {
  --ink: #121212;
  --muted: #6c6c6c;
  --accent: #e3262d;
  --paper: #e7e7e6;
  --pad: clamp(18px, 1.4vw + 6px, 40px);
  --ease: cubic-bezier(.22, .8, .24, 1);
  --font: "FuturaCyr", Futura, "Futura PT", "Century Gothic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
.hero[data-theme="dark"] {
  --ink: #f1f1ef;
  --muted: #8c8d91;
  --accent: #ff3b41;
  --paper: #0e0f12;
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  overflow: hidden;
  overscroll-behavior: none;
  background: #d3d3d2;
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color .7s var(--ease);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
:focus:not(:focus-visible) { outline: none; }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- hero ---------- */
.hero {
  position: relative;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  color: var(--ink);
  transition: --ink .6s var(--ease), --muted .6s var(--ease), --accent .6s var(--ease), --paper .6s var(--ease);
}
.bg { position: absolute; inset: 0; pointer-events: none; }
.bg-light {
  background:
    radial-gradient(46% 26% at 52% var(--floor, 72%), rgba(255, 255, 255, .8), rgba(255, 255, 255, 0) 72%),
    radial-gradient(140% 105% at 50% 58%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, .09) 100%),
    linear-gradient(180deg, #c3c3c2 0%, #d0d0cf 34%, #dfdfde 58%, #ebebea 76%, #e3e3e2 100%);
}
.bg-dark {
  opacity: 0;
  transition: opacity .7s var(--ease);
  background:
    radial-gradient(44% 24% at 52% var(--floor, 72%), rgba(84, 92, 104, .42), rgba(84, 92, 104, 0) 72%),
    radial-gradient(60% 50% at 50% 26%, rgba(46, 50, 58, .5), rgba(46, 50, 58, 0) 72%),
    linear-gradient(180deg, #07080a 0%, #0c0d10 52%, #121418 76%, #0a0b0d 100%);
}
.hero[data-theme="dark"] .bg-dark { opacity: 1; }

#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 2; pointer-events: none; }
.stage {
  position: absolute; inset: 0; z-index: 1;
  cursor: grab; touch-action: none;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
.stage.dragging { cursor: grabbing; }
.stage:focus-visible { outline-offset: -6px; }

/* ---------- left panel (menu + status) ---------- */
.panel { position: absolute; left: var(--pad); top: 50%; transform: translateY(-50%); z-index: 3; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.menu button {
  position: relative;
  display: block;
  padding: 9px 0;
  font-size: 17px; line-height: 1.2; letter-spacing: .005em;
  color: var(--muted);
  transition: color .3s var(--ease), transform .5s var(--ease);
}
.menu button::before {
  content: "";
  position: absolute; left: -14px; top: 50%;
  width: 6px; height: 6px; margin-top: -3px;
  border-radius: 50%;
  background: var(--accent);
  transform: scale(0);
  transition: transform .4s var(--ease);
}
.menu button:hover { color: var(--ink); }
.menu button[aria-pressed="true"] { color: var(--ink); transform: translateX(14px); }
.menu button[aria-pressed="true"]::before { transform: scale(1); }
.menu button.ping { animation: ping .7s var(--ease); }
@keyframes ping { 30% { color: var(--ink); transform: translateX(6px); } }

.status {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0 0 calc(-1 * var(--pad));
  font-weight: 700; font-size: 19px; letter-spacing: .01em; text-transform: uppercase;
  white-space: nowrap;
}
.status .rule { width: calc(var(--pad) + 4px); height: 1px; background: var(--ink); flex: none; }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.hero.powered .status .dot { animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); } }
.status-text { display: inline-block; transition: opacity .22s ease, transform .22s ease; }
.status-text.swap { opacity: 0; transform: translateY(-5px); }

/* ---------- outlined buttons (sound, theme) ---------- */
.outline {
  position: absolute; z-index: 3;
  display: inline-flex; align-items: center; gap: 10px;
  border: 1.5px solid var(--ink);
  border-radius: 0 0 14px 0;
  font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
  color: var(--ink);
  transition: background-color .3s var(--ease), color .3s var(--ease);
}
.outline:hover { background: var(--ink); color: var(--paper); }
.outline .ic { transition: transform .35s var(--ease); }
.top-actions { position: absolute; right: var(--pad); top: clamp(14px, 2.2vh, 24px); z-index: 3; display: flex; gap: 10px; }
.top-actions .outline { position: relative; height: 38px; padding: 0 14px 0 16px; font-size: 11.5px; border-radius: 0 0 12px 0; }
.sound .off, .sound.is-muted .on { display: none; }
.sound.is-muted .off { display: block; }
.theme .moon { display: block; }
.theme .sun { display: none; }
.hero[data-theme="dark"] .theme .moon { display: none; }
.hero[data-theme="dark"] .theme .sun { display: block; }

/* ---------- loader + hint ---------- */
.loader {
  position: absolute; left: 50%; top: 47%; z-index: 3;
  transform: translate(-50%, -50%);
  display: grid; justify-items: center; gap: 12px;
  font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  pointer-events: none;
  transition: opacity .5s var(--ease);
}
.loader i { display: block; width: 120px; height: 1px; background: color-mix(in srgb, var(--ink) 15%, transparent); overflow: hidden; position: relative; }
.loader i::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--ink); animation: slide 1.1s var(--ease) infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.loader.done { opacity: 0; }
.loader.error i { display: none; }

.hint {
  position: absolute; right: var(--pad); bottom: clamp(18px, 2.6vh, 30px); z-index: 3;
  font-size: 12px; color: var(--muted); letter-spacing: .02em;
  pointer-events: none;
  transition: opacity .6s var(--ease);
}
.hint.gone { opacity: 0; }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  .panel { display: contents; }
  .menu {
    position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 3;
    display: flex; justify-content: space-evenly; gap: 0; padding: 0 12px;
  }
  .menu li { display: flex; justify-content: center; }
  .menu button { font-size: 14px; padding: 16px 8px 10px; }
  .menu button[aria-pressed="true"] { transform: none; }
  .menu button::before { left: 50%; top: 5px; width: 5px; height: 5px; margin: 0 0 0 -2.5px; }
  .status { position: absolute; left: 0; top: 22px; z-index: 3; margin: 0; font-size: 15px; gap: 10px; }
  .status .rule { width: 18px; }
  .top-actions { right: 14px; top: 13px; gap: 8px; }
  .top-actions .outline { width: 36px; height: 34px; padding: 0; justify-content: center; }
  .top-actions .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .hint { display: none; }
}
@media (max-width: 520px) {
  .menu { flex-wrap: wrap; justify-content: center; gap: 2px 0; padding: 0 10px; }
  .menu li { flex: 0 0 33.333%; }
}

/* embedded in another site (e.g. a portfolio): scrolling and vertical swipes go to the host page */
html.embedded, html.embedded body { overflow: visible; overscroll-behavior: auto; }
html.embedded .stage { touch-action: pan-y; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4Z"/><path d="M15.6 9.2a4 4 0 0 1 0 5.6M18.2 6.6a7.6 7.6 0 0 1 0 10.8"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.2L12 5.6v12.8l-4.8-3.9H4Z"/><path d="m16 9.8 4.4 4.4M20.4 9.8 16 14.2"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2M12 19.2v2M2.8 12h2M19.2 12h2M5.5 5.5l1.4 1.4M17.1 17.1l1.4 1.4M5.5 18.5l1.4-1.4M17.1 6.9l1.4-1.4"/></symbol>
</svg>

<main class="hero" id="hero" data-theme="light">
  <div class="bg bg-light" aria-hidden="true"></div>
  <div class="bg bg-dark" aria-hidden="true"></div>

  <div class="stage" id="stage" tabindex="0" role="group" aria-roledescription="3D model viewer"
       aria-label="Concept vehicle. Drag to turn it, scroll or pinch to zoom, double-click to reset the view. Arrow keys rotate, plus and minus zoom, 0 resets."></div>
  <canvas id="gl" aria-hidden="true"></canvas>

  <div class="loader" id="loader" role="status"><i aria-hidden="true"></i><span id="loaderText">Loading model</span></div>

  <div class="panel">
    <nav aria-label="Vehicle controls">
      <ul class="menu">
        <li><button type="button" id="btnPower" aria-pressed="false">Power</button></li>
        <li><button type="button" id="btnHead" aria-pressed="false">Headlights</button></li>
        <li><button type="button" id="btnBrake" aria-pressed="false">Brake lights</button></li>
        <li><button type="button" id="btnHonk">Honk</button></li>
        <li><button type="button" id="btnReset">Reset</button></li>
      </ul>
    </nav>
    <p class="status" role="status" aria-live="polite"><span class="rule" aria-hidden="true"></span><span class="dot" aria-hidden="true"></span><span class="status-text" id="statusText">Standby</span></p>
  </div>

  <div class="top-actions">
    <button class="outline sound" type="button" id="btnSound">
      <span class="label" id="soundLabel">Sound on</span>
      <svg class="ic on" aria-hidden="true"><use href="#i-sound"/></svg>
      <svg class="ic off" aria-hidden="true"><use href="#i-mute"/></svg>
    </button>
    <button class="outline theme" type="button" id="btnTheme" aria-pressed="false">
      <span class="label" id="themeLabel">Dark mode</span>
      <svg class="ic moon" aria-hidden="true"><use href="#i-moon"/></svg>
      <svg class="ic sun" aria-hidden="true"><use href="#i-sun"/></svg>
    </button>
  </div>


  <p class="hint" id="hint" aria-hidden="true">Drag to rotate · Scroll to zoom</p>
</main>

<script type="module">
/* ============================================================
   Settings
   ============================================================ */
const MODEL_FILE = 'futuristic vehicle 3d model.glb';   // used only if car-assets.js is missing
const LIFT = 0.2;                                       // hover height, as a fraction of the vehicle's height
const YAW0 = -0.62, ELEV0 = 0.12;                       // home view: front three-quarter, camera just above
const ZMIN = 0.6, ZMAX = 2.4;

/* ============================================================
   State + DOM
   ============================================================ */
const S = {
  power: false, head: false, brake: false, dark: false,
  yaw: YAW0, yawVel: 0, yawQ: 0, homing: false,
  elev: ELEV0, elevT: ELEV0, zoom: 1, zoomT: 1,
  dragging: false, honkAt: -1e9, powerAt: -1e9, muted: false,
};
const $ = (s) => document.querySelector(s);
const hero = $('#hero'), stage = $('#stage'), canvas = $('#gl');
const loader = $('#loader'), loaderText = $('#loaderText'), hint = $('#hint');
const btnPower = $('#btnPower'), btnHead = $('#btnHead'), btnBrake = $('#btnBrake');
const btnHonk = $('#btnHonk'), btnReset = $('#btnReset'), btnTheme = $('#btnTheme');
const btnSound = $('#btnSound'), soundLabel = $('#soundLabel');
const statusText = $('#statusText'), themeLabel = $('#themeLabel'), themeMeta = $('meta[name="theme-color"]');
const EMBEDDED = (() => { try { return window.self !== window.top; } catch { return true; } })();
const params = new URLSearchParams(location.search);       // ?theme=dark|light sets the starting mode
if (EMBEDDED) {
  document.documentElement.classList.add('embedded');
  hint.textContent = `Drag to rotate · ${/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl'} + scroll to zoom`;
}
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const phoneMQ = matchMedia('(max-width: 760px)');
const reduced = () => reduceMQ.matches;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const wrapPi = (a) => Math.atan2(Math.sin(a), Math.cos(a));

function b64ToBuffer(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}

/* ---------- fonts: Futura Cyrillic when car-fonts.js is present, otherwise the Futura-like fallbacks in --font ---------- */
if (window.CAR_FONTS) {
  for (const [weight, b64] of [['400', window.CAR_FONTS.book], ['700', window.CAR_FONTS.bold]]) {
    const f = new FontFace('FuturaCyr', b64ToBuffer(b64), { weight });
    document.fonts.add(f);
    f.load().catch(() => {});
  }
}

/* ============================================================
   Status line
   ============================================================ */
let statusTimer = 0, swapTimer = 0;
const summary = () => (S.power ? 'Levitating' : 'Standby');
function showStatus(text) {
  if (statusText.textContent === text && !statusText.classList.contains('swap')) return;
  clearTimeout(swapTimer);
  if (reduced()) { statusText.textContent = text; return; }
  statusText.classList.add('swap');
  swapTimer = setTimeout(() => { statusText.textContent = text; statusText.classList.remove('swap'); }, 200);
}
function flashStatus(text, ms = 1500) {
  clearTimeout(statusTimer);
  showStatus(text);
  statusTimer = setTimeout(() => showStatus(summary()), ms);
}

/* ============================================================
   Controls
   ============================================================ */
const press = (el, on) => el.setAttribute('aria-pressed', on ? 'true' : 'false');
const ping = (el) => { el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping'); };

function setPower(on, quiet) {
  if (S.power === on) return;
  S.power = on;
  press(btnPower, on);
  hero.classList.toggle('powered', on);
  if (on) S.powerAt = performance.now();
  on ? Sound.powerUp() : Sound.powerDown();
  if (!quiet) on ? (clearTimeout(statusTimer), showStatus('Levitating')) : flashStatus('Landing', 1400);
}
function setHead(on, quiet) {
  S.head = on; press(btnHead, on);
  if (!quiet) flashStatus(on ? 'Headlights on' : 'Headlights off');
}
function setBrake(on, quiet) {
  S.brake = on; press(btnBrake, on);
  if (!quiet) flashStatus(on ? 'Brake lights on' : 'Brake lights off');
}
function resetView() {
  S.homing = true; S.yawVel = 0; S.yawQ = 0;
  S.elevT = ELEV0; setZoom(1);
}
function resetAll() {
  setPower(false, true); setHead(false, true); setBrake(false, true);
  resetView();
  flashStatus('Reset', 1300);
}
function setZoom(z) { S.zoomT = clamp(z, ZMIN, ZMAX); }

function setTheme(dark, save = true) {
  S.dark = dark;
  hero.dataset.theme = dark ? 'dark' : 'light';
  press(btnTheme, dark);
  themeLabel.textContent = dark ? 'Light mode' : 'Dark mode';
  btnTheme.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  document.body.style.backgroundColor = dark ? '#0c0d10' : '#d3d3d2';
  themeMeta.setAttribute('content', dark ? '#0c0d10' : '#d3d3d2');
  if (save) { try { localStorage.setItem('cv-theme', dark ? 'dark' : 'light'); } catch { /* storage unavailable */ } }
}

/* ============================================================
   Sound — everything is synthesised, and runs through one master volume (mute)
   ============================================================ */
const Sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  const VOLUME = 0.9;
  let ctx = null, master = null, noise = null, hum = null, seq = null, muted = false;

  function ready() {
    if (!AC) return false;
    if (!ctx) {
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = muted ? 0 : VOLUME;
      const limiter = ctx.createDynamicsCompressor();          // keeps the layered sounds from clipping
      master.connect(limiter); limiter.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }
  const osc = (type, f, t) => { const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; };
  const amp = (v, to) => { const g = ctx.createGain(); g.gain.value = v; if (to) g.connect(to); return g; };
  const filter = (type, f, q, to) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; if (to) b.connect(to); return b; };
  const hiss = () => { const n = ctx.createBufferSource(); n.buffer = noise; n.loop = true; return n; };
  const hold = (p, t) => {                                    // freeze a parameter where it is right now
    if (p.cancelAndHoldAtTime) p.cancelAndHoldAtTime(t);
    else { const v = p.value; p.cancelScheduledValues(t); p.setValueAtTime(v, t); }
  };
  const blip = (to, t, f0, f1, len, vol) => {
    const o = osc('sine', f0, t), g = amp(0, to);
    o.frequency.exponentialRampToValueAtTime(f1, t + len * 0.8);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); o.start(t); o.stop(t + len + 0.02);
  };

  // each power sequence gets its own bus, so pressing Power again quickly fades the last one out
  function newSequence(t) {
    if (seq) { const old = seq; hold(old.gain, t); old.gain.setTargetAtTime(0, t, 0.04); setTimeout(() => old.disconnect(), 500); }
    seq = amp(1, master);
    return seq;
  }

  // steady hover hum: low detuned drone with a slow swell, in step with the bob
  function startHum(t) {
    stopHum(t, 0.2);
    const out = amp(0, master), swell = amp(1, out);
    out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(0.055, t + 1.4);
    const lfo = osc('sine', 0.27, t), lfoDepth = amp(0.28); lfo.connect(lfoDepth); lfoDepth.connect(swell.gain);
    const lp = filter('lowpass', 900, 0.7, swell);
    const tones = [osc('sine', 58, t), osc('sine', 116.7, t), osc('triangle', 233, t)];
    [0.9, 0.42, 0.1].forEach((v, i) => tones[i].connect(amp(v, lp)));
    const n = hiss(); n.connect(filter('bandpass', 420, 0.9, amp(0.07, lp)));
    [...tones, n, lfo].forEach((s) => s.start(t));
    hum = { out, tones, all: [...tones, n, lfo] };
  }
  function stopHum(t, fade) {
    if (!hum) return;
    const { out, tones, all } = hum; hum = null;
    hold(out.gain, t);
    out.gain.setTargetAtTime(0, t, fade / 4);
    tones.forEach((o) => { hold(o.frequency, t); o.frequency.exponentialRampToValueAtTime(o.frequency.value * 0.55, t + fade); });
    all.forEach((s) => s.stop(t + fade + 0.1));
  }

  function powerUp() {
    if (!ready()) return;
    const t = ctx.currentTime + 0.02, bus = newSequence(t);
    // boot chirps
    blip(bus, t, 620, 1240, 0.12, 0.06);
    blip(bus, t + 0.11, 880, 1760, 0.14, 0.06);
    // turbine spool: detuned saws sweeping up through a resonant low-pass
    const spool = amp(0, bus), lp = filter('lowpass', 220, 7, spool);
    lp.frequency.setValueAtTime(220, t); lp.frequency.exponentialRampToValueAtTime(2600, t + 0.9); lp.frequency.exponentialRampToValueAtTime(900, t + 2.2);
    spool.gain.setValueAtTime(0, t); spool.gain.linearRampToValueAtTime(0.1, t + 0.5);
    spool.gain.setValueAtTime(0.1, t + 0.9); spool.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    const vib = osc('sine', 7, t), vibDepth = amp(5); vib.connect(vibDepth);
    for (const [type, mul, det] of [['sawtooth', 1, -6], ['sawtooth', 1.5, 7], ['triangle', 2, 0]]) {
      const o = osc(type, 60 * mul, t); o.detune.value = det;
      o.frequency.exponentialRampToValueAtTime(330 * mul, t + 0.85);

/* ============================================================
   Pointer: turn, tilt, pinch, wheel, double-tap
   ============================================================ */
const view = { W: 0, H: 0, cx: 0, cy: 0, px: 300, framed: false };
const ptrs = new Map();
let pinchD0 = 1, pinchZ0 = 1, lastMoveT = 0, lastTapT = 0, hintGone = false;
function interact() { if (!hintGone) { hintGone = true; hint.classList.add('gone'); } }

stage.addEventListener('pointerdown', (e) => {
  if (e.button > 0) return;
  try { stage.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: e.timeStamp });
  if (ptrs.size === 1) {
    S.dragging = true; S.homing = false; S.yawVel = 0; S.yawQ = 0;
    lastMoveT = e.timeStamp;
    stage.classList.add('dragging');
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    pinchD0 = Math.hypot(a.x - b.x, a.y - b.y) || 1; pinchZ0 = S.zoomT; S.yawVel = 0;
  }
  interact();
});
stage.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    const k = Math.PI / Math.max(320, view.px * 2.2);
    S.yaw += dx * k;
    S.elevT = clamp(S.elevT + dy * k * 0.6, 0.02, 0.62);
    const dts = Math.max(8, e.timeStamp - lastMoveT) / 1000;
    lastMoveT = e.timeStamp;
    S.yawVel = clamp(S.yawVel * 0.35 + (dx * k / dts) * 0.65, -12, 12);
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    setZoom(pinchZ0 * Math.hypot(a.x - b.x, a.y - b.y) / pinchD0);
  }
});
function release(e) {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size) { S.yawVel = 0; lastMoveT = e.timeStamp; return; }
  S.dragging = false;
  stage.classList.remove('dragging');
  if (e.timeStamp - lastMoveT > 90) S.yawVel = 0;
  if (e.pointerType !== 'mouse' && e.type === 'pointerup' &&
      Math.hypot(e.clientX - p.sx, e.clientY - p.sy) < 10 && e.timeStamp - p.t < 300) {
    if (e.timeStamp - lastTapT < 320) { resetView(); lastTapT = 0; } else lastTapT = e.timeStamp;
  }
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);
stage.addEventListener('lostpointercapture', release);
stage.addEventListener('dblclick', resetView);
stage.addEventListener('wheel', (e) => {
  if (EMBEDDED && !e.ctrlKey && !e.metaKey) return;        // embedded: plain scrolling moves the host page
  e.preventDefault();
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
  setZoom(S.zoomT * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0016)));
  interact();
}, { passive: false });
let gestureZ0 = 1;
stage.addEventListener('gesturestart', (e) => { e.preventDefault(); gestureZ0 = S.zoomT; });
stage.addEventListener('gesturechange', (e) => { e.preventDefault(); if (!ptrs.size) setZoom(gestureZ0 * e.scale); });
stage.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowLeft':  S.homing = false; S.yawQ -= 0.3; break;
    case 'ArrowRight': S.homing = false; S.yawQ += 0.3; break;
    case 'ArrowUp':    S.elevT = clamp(S.elevT - 0.08, 0.02, 0.62); break;
    case 'ArrowDown':  S.elevT = clamp(S.elevT + 0.08, 0.02, 0.62); break;
    case '+': case '=': setZoom(S.zoomT * 1.2); break;
    case '-': case '_': setZoom(S.zoomT / 1.2); break;
    case '0': resetView(); break;
    default: return;
  }
  e.preventDefault();
  interact();
});

function measure() {
  const r = hero.getBoundingClientRect();
  view.W = r.width; view.H = r.height;
}
function frameTarget() {
  const { W, H } = view;
  if (phoneMQ.matches) return [W * 0.5, H * 0.45, Math.min(H * 0.34, W * 0.7)];
  return [W * 0.52, H * 0.47, Math.min(H * 0.44, W * 0.38)];
}
function placeFloor() {                                 // keep the backdrop's floor glow under the vehicle
  const [, cy, px] = frameTarget();
  if (view.H) hero.style.setProperty('--floor', `${((cy + 0.5 * px) / view.H * 100).toFixed(1)}%`);
}
new ResizeObserver(() => { measure(); placeFloor(); }).observe(hero);
measure(); placeFloor();

let G = null;

      if (m.map) { m.map.anisotropy = maxAniso; m.map.needsUpdate = true; }
      addLamps(m);
    }
  });
  holder.add(model);
  try { await renderer.compileAsync(scene, camera); } catch { /* compiled on first draw */ }

  G = { renderer };
  yawG.visible = true;
  loader.classList.add('done');

  /* ---- frame loop ---- */
  let last = performance.now(), lift = 0, liftVel = 0, powerAmt = 0, headAmt = 0, brakeAmt = 0, flash = 0, intro = 0;
  let lastW = 0, lastH = 0, lastDpr = 0;
  const qTmp = new THREE.Quaternion(), vN = new THREE.Vector3(), vP = new THREE.Vector3(), vC = new THREE.Vector3();
  const ease = (cur, tgt, rate, dt) => cur + (tgt - cur) * (1 - Math.exp(-dt * rate));

  function tick(now) {
    requestAnimationFrame(tick);
    const dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    const t = now / 1000, calm = reduced();
    if (!view.W || !view.H) return;

    const dpr = Math.min(devicePixelRatio, 2);
    if (view.W !== lastW || view.H !== lastH || dpr !== lastDpr) {
      lastW = view.W; lastH = view.H; lastDpr = dpr;
      renderer.setPixelRatio(dpr);
      renderer.setSize(view.W, view.H, false);
    }

    /* framing + view */
    const [tcx, tcy, tpx] = frameTarget();
    if (!view.framed) { view.cx = tcx; view.cy = tcy; view.px = tpx; view.framed = true; }
    const kf = 1 - Math.exp(-dt * 7);
    view.cx += (tcx - view.cx) * kf; view.cy += (tcy - view.cy) * kf; view.px += (tpx - view.px) * kf;
    S.zoom = ease(S.zoom, S.zoomT, 6, dt);
    S.elev = ease(S.elev, S.elevT, 8, dt);

    /* turntable: queue, inertia, homing */
    if (S.yawQ) {
      let st = S.yawQ * (1 - Math.exp(-dt * 5));
      if (Math.abs(S.yawQ - st) < 1e-4) st = S.yawQ;
      S.yawQ -= st; S.yaw += st;
    }
    if (!S.dragging && S.yawVel) {
      S.yaw += S.yawVel * dt;
      S.yawVel *= Math.exp(-dt * 4.5);
      if (Math.abs(S.yawVel) < 1e-3) S.yawVel = 0;
    }
    if (S.homing) {
      const d = wrapPi(YAW0 - S.yaw);
      S.yaw += d * (1 - Math.exp(-dt * 5));
      if (Math.abs(d) < 1e-3 && Math.abs(S.elev - ELEV0) < 1e-3) { S.yaw = YAW0; S.homing = false; }
    }

    /* power: spool up, lift off, hover; land, then spool down */
    const spoolT = S.power ? 1 : (lift < 0.015 ? 0 : powerAmt);
    powerAmt = ease(powerAmt, spoolT, S.power ? 3.2 : 2.4, dt);
    const liftT = S.power && powerAmt > 0.8 ? LIFT : 0;     // lift off ~0.5 s after Power, with the sound
    if (calm) {
      lift = ease(lift, liftT, 3, dt); liftVel = 0;
    } else {
      const k = 26, c = 2 * Math.sqrt(k) * (S.power ? 0.6 : 1.05);
      liftVel += ((liftT - lift) * k - liftVel * c) * dt;
      lift += liftVel * dt;
      if (lift < 0) { lift = 0; liftVel = 0; }
    }
    const ln = clamp(lift / LIFT, 0, 1.3);
    const hover = calm ? 0 : clamp(ln, 0, 1);

    /* lights */
    const sinceHonk = now - S.honkAt;
    const flashOn = (sinceHonk > 0 && sinceHonk < 190) || (sinceHonk > 270 && sinceHonk < 640);
    flash = ease(flash, flashOn ? 1 : 0, 22, dt);
    headAmt = ease(headAmt, S.head ? 1 : 0, 9, dt);
    brakeAmt = ease(brakeAmt, S.brake ? 1 : 0, 12, dt);
    const head = Math.max(headAmt, flash);
    lampU.uHead.value = head;
    lampU.uBrake.value = brakeAmt;
    lampU.uPower.value = powerAmt;

    /* rig transforms */
    intro = Math.min(1, intro + dt / 0.9);
    const introE = calm ? 1 : 1 - (1 - intro) ** 3;
    yawG.rotation.y = S.yaw;
    const shakeAmt = calm ? 0 : Math.max(0, 1 - sinceHonk / 450) * 0.6 + (S.power ? Math.max(0, 1 - (now - S.powerAt) / 700) : 0);
    liftG.position.y = lift + Math.sin(t * 1.7) * 0.012 * hover + (1 - introE) * 0.04;
    liftG.rotation.x = clamp(-liftVel * 0.12, -0.08, 0.08) + Math.sin(t * 1.13) * 0.009 * hover;
    liftG.rotation.z = Math.sin(t * 0.87 + 1.3) * 0.011 * hover + Math.sin(t * 57) * 0.0035 * shakeAmt;
    holder.parent.scale.setScalar(0.94 + 0.06 * introE);

    /* floor */
    shadowCore.material.opacity = 0.5 * (1 - 0.62 * ln) * introE;
    shadowCore.scale.set(0.92 * (1 + 0.3 * ln), 1, 1.08 * (1 + 0.3 * ln));
    shadowWide.material.opacity = 0.22 * (1 - 0.25 * ln) * introE;
    shadowWide.scale.set(1.45 * (1 + 0.35 * ln), 1, 1.65 * (1 + 0.35 * ln));
    poolHover.material.opacity = powerAmt * (0.18 + 0.32 * ln) * (0.6 + 0.4 * glowK);
    poolHead.material.opacity = head * 0.34 * glowK * (1 - 0.3 * ln);
    poolBrake.material.opacity = brakeAmt * 0.22 * glowK;
    const rp = (now - S.powerAt - 500) / 1100;
    ripple.visible = !calm && S.power && rp >= 0 && rp < 1;
    if (ripple.visible) {
      ripple.scale.set(0.5 + 2.2 * rp, 1, 0.55 + 2.4 * rp);
      ripple.material.opacity = 0.55 * (1 - rp) * (1 - rp);
    }
    underLight.intensity = powerAmt * 0.09;

    /* camera: vehicle height spans px * zoom pixels, target lands on (cx, cy) */
    const dist = view.H / (2 * TAN * view.px * S.zoom);
    camera.aspect = view.W / view.H;
    camera.position.set(0, TARGET.y + Math.sin(S.elev) * dist, Math.cos(S.elev) * dist);
    camera.lookAt(TARGET);
    camera.setViewOffset(view.W, view.H, view.W / 2 - view.cx, view.H / 2 - view.cy, view.W, view.H);

    /* glows: fade with the lamp facing away from the camera */
    scene.updateMatrixWorld();
    holder.getWorldQuaternion(qTmp);
    for (const sp of sprites) {
      const { kind, nz, base } = sp.userData;
      const amt = kind === 'head' ? head : kind === 'brake' ? brakeAmt : powerAmt;
      vN.set(0, 0, nz).applyQuaternion(qTmp);
      sp.getWorldPosition(vP);
      const facing = THREE.MathUtils.smoothstep(vN.dot(vC.subVectors(camera.position, vP).normalize()), -0.15, 0.45);
      sp.material.opacity = amt * facing * (kind === 'brake' ? 0.9 : 0.85) * (0.55 + 0.45 * glowK);
      sp.scale.setScalar(base * (0.85 + 0.15 * amt));
      sp.visible = sp.material.opacity > 0.002;
    }
    beam.visible = head > 0.002;
    if (beam.visible) beamMat.uniforms.uAmt.value = head * glowK * placeBeam(qTmp);

    /* theme mood */
    const M = S.dark ? THEMES.dark : THEMES.light, kl = 1 - Math.exp(-dt * 4);
    scene.environmentIntensity += (M.env - scene.environmentIntensity) * kl;
    key.intensity += (M.key - key.intensity) * kl;
    rim.intensity += (M.rim - rim.intensity) * kl;
    renderer.toneMappingExposure += (M.exposure - renderer.toneMappingExposure) * kl;
    glowK += (M.glow - glowK) * kl;

    renderer.render(scene, camera);
  }
  requestAnimationFrame(tick);
}

function fail(msg) {
  loader.classList.add('error');
  loaderText.textContent = msg;
}

initGL();
</script>
</body>
</html>
